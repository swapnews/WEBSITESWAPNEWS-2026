<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="swapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b2b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c130e"/>
      <stop offset="100%" stop-color="#0e0805"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 107, 43, 0.3)" stroke-width="2"/>

  <!-- Glowing Swap Arrows Emblem (SwapNews Identity) -->
  <g filter="url(#glow)">
    <!-- Top curved right arrow -->
    <path d="M 34 50 C 34 38, 48 34, 68 34 L 80 34 M 72 24 L 92 34 L 72 44" 
          fill="none" 
          stroke="url(#swapGrad)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom curved left arrow -->
    <path d="M 94 78 C 94 90, 80 94, 60 94 L 48 94 M 56 104 L 36 94 L 56 84" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central News Flare Dot -->
    <circle cx="64" cy="64" r="5.5" fill="#ff6b2b"/>
  </g>
</svg>
